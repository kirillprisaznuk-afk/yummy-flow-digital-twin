[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "yummy-flow-digital-twin"
version = "0.1.0"
description = "Synthetic quick-commerce operations and unit economics simulator"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "httpx2>=2.13,<3"]
api = ["fastapi>=0.141,<1", "starlette>=1.7,<2", "uvicorn>=0.34,<1", "SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "alembic>=1.16,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.database.migrations" = ["script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgresql: requires a real server configured through YUMMY_TEST_POSTGRES_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["app.domain"]

[tool.coverage.report]
show_missing = true
fail_under = 95
